name: Security and static analysis
on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-test.lock
      - run: pipx install ruff && pipx install bandit && pipx install pip-audit
      - run: ruff check --select F app scripts reference *.py
      - run: bandit -q -r app rag_service.py auth_oidc.py production_admin.py production_runtime.py production_store.py disaster_recovery.py document_source.py reference_answer.py reference_ranking.py pdf_daemon.py pdf_transport.py pdf_worker.py -ll
      - run: pip-audit --progress-spinner off --require-hashes -r requirements-runtime.lock
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
