name: Security and static analysis
on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt ruff bandit pip-audit
      - run: ruff check --select F rag_service.py auth_oidc.py app/api.py query_intent.py eval_benchmark.py eval_retrieval.py
      - run: bandit -q -r rag_service.py auth_oidc.py app -ll
      - run: pip-audit --progress-spinner off
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
