name: Security and static analysis
on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-test.lock
      - run: >-
          pipx install ruff==0.17.6 &&
          pipx install bandit==1.9.4 &&
          pipx install pip-audit==2.10.1
      - run: ruff check --select F app scripts reference *.py
      - run: bandit -q -r app scripts rag_service.py auth_oidc.py production_admin.py production_runtime.py production_store.py disaster_recovery.py document_source.py reference_answer.py reference_ranking.py pdf_daemon.py pdf_transport.py pdf_worker.py -ll
      - run: pip-audit --progress-spinner off --require-hashes -r requirements-runtime.lock
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4

  codeql_original_alert:
    name: CodeQL alert #2 remediated in PR
    needs: codeql
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 10
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify original TLS rule absent in exact PR CodeQL analysis
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_codeql_alert_2.py

  codeql_original_alert_main:
    name: CodeQL alert #2 fixed on main
    needs: codeql
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify alert #2 is formally fixed on protected main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_codeql_alert_2.py

