name: Production profile
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, "hardening/**"]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build candidate and capture immutable Buildx metadata
        env:
          BUILDX_METADATA_PROVENANCE: max
        run: >-
          docker buildx build --platform linux/amd64 --load --provenance=false
          --metadata-file rag-build-metadata.json
          --tag rag-candidate:${GITHUB_SHA} .
      - name: Verify SQLite runtime and absence of affected CLI
        run: >-
          docker run --rm --network none --entrypoint python rag-candidate:${GITHUB_SHA}
          -c 'import shutil, sqlite3; assert sqlite3.sqlite_version_info >= (3,54,1); assert shutil.which("sqlite3") is None'
      - name: Exercise deployment, policy and restore
        run: python3 scripts/deployment_smoke.py rag-candidate:${GITHUB_SHA}
      - id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: rag-candidate:${{ github.sha }}
          severity-cutoff: high
          fail-build: false
          output-format: json
      - name: Preserve raw primary scan
        env:
          RAG_SCAN_REPORT: ${{ steps.scan.outputs.json }}
        run: cp "$RAG_SCAN_REPORT" rag-grype.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rag-image-scan-${{ github.sha }}
          path: rag-grype.json
          if-no-files-found: error
      - name: Verify OCI image identity across Buildx and Grype
        run: >-
          python3 scripts/image_identity.py rag-build-metadata.json rag-grype.json
          rag-candidate:${GITHUB_SHA} rag-image-identity.json
      - name: Collect isolated OpenSSL reachability evidence
        run: |
          docker image inspect rag-candidate:${GITHUB_SHA} > rag-image-inspect.json
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            --entrypoint python \
            --mount "type=bind,src=$PWD/scripts/openssl_reachability.py,dst=/reachability.py,readonly" \
            --mount "type=bind,src=$PWD/rag-image-inspect.json,dst=/image-inspect.json,readonly" \
            rag-candidate:${GITHUB_SHA} /reachability.py /image-inspect.json - > rag-openssl-evidence.json
      - name: Generate deterministic OpenVEX investigation evidence
        run: >-
          python3 scripts/openvex_inventory.py rag-grype.json rag-image-identity.json
          rag-investigation.openvex.json
      - name: Strictly validate OpenVEX v0.2.0
        run: |
          validator=ghcr.io/openvex/vexctl:v0.4.4@sha256:ce15c9c85ffc66cb630c0ce9c50a85e9241be77ca4e6e841ab14a0bf2a96bf7e
          docker pull "$validator"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            --mount "type=bind,src=$PWD/rag-investigation.openvex.json,dst=/vex.json,readonly" \
            "$validator" validate --strict /vex.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rag-vex-investigation-${{ github.sha }}
          path: |
            rag-build-metadata.json
            rag-image-identity.json
            rag-investigation.openvex.json
          if-no-files-found: error
      - name: Secondary vulnerability scan of the saved candidate
        run: bash scripts/trivy_image_scan.sh rag-candidate:${GITHUB_SHA} rag-trivy.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rag-trivy-scan-${{ github.sha }}
          path: rag-trivy.json
          if-no-files-found: error
      - name: Compare independent scanner evidence
        id: comparison
        run: >-
          python3 scripts/compare_image_scans.py rag-grype.json rag-trivy.json
          rag-image-identity.json rag-scan-comparison.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && (steps.comparison.outcome == 'success' || steps.comparison.outcome == 'failure')
        with:
          name: rag-scan-comparison-${{ github.sha }}
          path: rag-scan-comparison.json
          if-no-files-found: error
      - name: Evaluate exact evidence-backed release dispositions
        id: release_policy
        continue-on-error: true
        run: >-
          python3 scripts/evaluate_release_findings.py
          rag-grype.json rag-trivy.json rag-openssl-evidence.json
          security/openssl-3.5.9-r1-dispositions.json rag-image-identity.json
          rag-release-decisions.json rag-release.openvex.json
      - name: Strictly validate reviewed release OpenVEX
        id: validate_release_vex
        if: always() && (steps.release_policy.outcome == 'success' || steps.release_policy.outcome == 'failure')
        continue-on-error: true
        run: |
          validator=ghcr.io/openvex/vexctl:v0.4.4@sha256:ce15c9c85ffc66cb630c0ce9c50a85e9241be77ca4e6e841ab14a0bf2a96bf7e
          test -s rag-release.openvex.json
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            --mount "type=bind,src=$PWD/rag-release.openvex.json,dst=/vex.json,readonly" \
            "$validator" validate --strict /vex.json
      - name: Preserve release disposition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rag-release-security-${{ github.sha }}
          path: |
            rag-openssl-evidence.json
            rag-release-decisions.json
            rag-release.openvex.json
          if-no-files-found: warn
      - name: Enforce combined fail-closed vulnerability gate
        env:
          POLICY_OUTCOME: ${{ steps.release_policy.outcome }}
          VEX_OUTCOME: ${{ steps.validate_release_vex.outcome }}
        run: |
          [[ "$POLICY_OUTCOME" == success ]]
          [[ "$VEX_OUTCOME" == success ]]
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: rag-candidate:${{ github.sha }}
          format: spdx-json
          output-file: rag.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: rag-candidate:${{ github.sha }}
          format: cyclonedx-json
          output-file: rag.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - run: |
          docker image inspect --format '{{.Id}}' rag-candidate:${GITHUB_SHA} > rag-image.id
          docker save rag-candidate:${GITHUB_SHA} | gzip > rag-image.tar.gz
          sha256sum rag-image.tar.gz rag-image.id rag.spdx.json rag.cdx.json \
            rag-build-metadata.json rag-image-identity.json rag-grype.json rag-trivy.json \
            rag-scan-comparison.json rag-investigation.openvex.json rag-openssl-evidence.json \
            rag-release-decisions.json rag-release.openvex.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rag-candidate-${{ github.sha }}
          path: |
            rag-image.tar.gz
            rag-image.id
            rag.spdx.json
            rag.cdx.json
            rag-build-metadata.json
            rag-image-identity.json
            rag-grype.json
            rag-trivy.json
            rag-scan-comparison.json
            rag-investigation.openvex.json
            rag-openssl-evidence.json
            rag-release-decisions.json
            rag-release.openvex.json
            SHA256SUMS
          if-no-files-found: error
  attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: rag-candidate-${{ github.sha }}
      - run: sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: rag-image.tar.gz, rag-image.id, rag.spdx.json, rag.cdx.json, rag-image-identity.json, rag-investigation.openvex.json, rag-release.openvex.json
