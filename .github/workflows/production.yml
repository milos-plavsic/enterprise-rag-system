name: Production profile
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, "hardening/**"]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: docker build --platform linux/amd64 --tag rag-candidate:${GITHUB_SHA} .
      - name: Verify SQLite runtime and absence of affected CLI
        run: >-
          docker run --rm --network none --entrypoint python rag-candidate:${GITHUB_SHA}
          -c 'import shutil, sqlite3; assert sqlite3.sqlite_version_info >= (3,54,1); assert shutil.which("sqlite3") is None'
      - name: Exercise deployment, policy and restore
        run: python3 scripts/deployment_smoke.py rag-candidate:${GITHUB_SHA}
      - id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: rag-candidate:${{ github.sha }}
          severity-cutoff: high
          fail-build: false
          output-format: json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rag-image-scan-${{ github.sha }}
          path: ${{ steps.scan.outputs.json }}
          if-no-files-found: error
      - name: Record image-bound OpenVEX investigation evidence
        env:
          RAG_SCAN_REPORT: ${{ steps.scan.outputs.json }}
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' rag-candidate:${GITHUB_SHA})
          python3 scripts/openvex_inventory.py "$RAG_SCAN_REPORT" "$image_id" rag-investigation.openvex.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rag-vex-investigation-${{ github.sha }}
          path: rag-investigation.openvex.json
          if-no-files-found: error
      - name: Secondary vulnerability scan of the saved candidate
        run: bash scripts/trivy_image_scan.sh rag-candidate:${GITHUB_SHA} rag-trivy.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rag-trivy-scan-${{ github.sha }}
          path: rag-trivy.json
          if-no-files-found: error
      - name: Compare scanners and evaluate secondary policy
        id: comparison
        continue-on-error: true
        env:
          RAG_SCAN_REPORT: ${{ steps.scan.outputs.json }}
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' rag-candidate:${GITHUB_SHA})
          python3 scripts/compare_image_scans.py "$RAG_SCAN_REPORT" rag-trivy.json "$image_id" rag-scan-comparison.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && (steps.comparison.outcome == 'success' || steps.comparison.outcome == 'failure')
        with:
          name: rag-scan-comparison-${{ github.sha }}
          path: rag-scan-comparison.json
          if-no-files-found: error
      - name: Enforce combined fail-closed vulnerability gate
        env:
          RAG_SCAN_REPORT: ${{ steps.scan.outputs.json }}
          SECONDARY_OUTCOME: ${{ steps.comparison.outcome }}
        shell: bash
        run: |
          primary=0
          python3 scripts/check_image_scan.py "$RAG_SCAN_REPORT" || primary=$?
          [[ "$primary" == 0 && "$SECONDARY_OUTCOME" == success ]]
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: rag-candidate:${{ github.sha }}
          format: spdx-json
          output-file: rag.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: rag-candidate:${{ github.sha }}
          format: cyclonedx-json
          output-file: rag.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - run: |
          docker image inspect --format '{{.Id}}' rag-candidate:${GITHUB_SHA} > rag-image.id
          docker save rag-candidate:${GITHUB_SHA} | gzip > rag-image.tar.gz
          sha256sum rag-image.tar.gz rag-image.id rag.spdx.json rag.cdx.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rag-candidate-${{ github.sha }}
          path: |
            rag-image.tar.gz
            rag-image.id
            rag.spdx.json
            rag.cdx.json
            SHA256SUMS
          if-no-files-found: error
  attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: rag-candidate-${{ github.sha }}
      - run: sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: rag-image.tar.gz, rag-image.id, rag.spdx.json, rag.cdx.json
