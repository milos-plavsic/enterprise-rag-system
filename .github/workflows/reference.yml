name: Self-contained reference lab
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "hardening/**"]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --prefix .github/reference-browser
      - run: .github/reference-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: docker build --platform linux/amd64 -t juniper-rag:local .
      - name: Verify reference identity and document lifecycle in Chromium
        env:
          NODE_PATH: .github/reference-browser/node_modules
          RAG_LAB_TEST_MODEL: "1"
        run: bash scripts/reference_compose_smoke.sh "$RUNNER_TEMP/juniper-lab"
      - name: Run the fictional benchmark in the application image
        run: |
          docker run --rm --network none --entrypoint python \
            -v "$PWD/reference:/app/reference:ro" \
            -v "$PWD/reference_benchmark.py:/app/reference_benchmark.py:ro" \
            -e OPENBLAS_NUM_THREADS=1 juniper-rag:local /app/reference_benchmark.py > reference-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: juniper-fictional-retrieval-report
          path: reference-report.json
          if-no-files-found: error
